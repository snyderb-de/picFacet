name: PicFacet
options:
  bundleIdPrefix: com.picfacet
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  # WebP encoder. macOS's ImageIO decodes WebP but cannot write it.
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    exactVersion: 1.6.0

settings:
  base:
    SWIFT_VERSION: "6"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "$(TARGET_NAME)"
  configs:
    Debug:
      # xcodegen's generated Debug config has no defaults on this toolchain, so
      # state them: tests use @testable import and need -enable-testing.
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: YES
    Release:
      # Xcode otherwise injects com.apple.security.get-task-allow into
      # dev-signed builds, letting any same-user process attach to the app and
      # borrow its folder/Full Disk Access grants.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:

  PicFacetCore:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PicFacetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picfacet.core
        INFOPLIST_FILE: PicFacetCore/Info.plist
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_DYLIB_INSTALL_NAME: "@rpath/PicFacetCore.framework/Versions/A/PicFacetCore"
    dependencies:
      - package: libwebp

  PicFacet:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PicFacet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picfacet.app
        INFOPLIST_FILE: PicFacet/Info.plist
        CODE_SIGN_ENTITLEMENTS: PicFacet/PicFacet.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: PicFacetCore
        embed: true
        codeSign: true
      - target: PicFacetFinderSync
        embed: true
        codeSign: true
      # Background folder watcher, registered with SMAppService.loginItem.
      - target: PicFacetWatcher
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    scheme:
      testTargets:
        - PicFacetCoreTests

  PicFacetWatcher:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PicFacetWatcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picfacet.app.watcher
        INFOPLIST_FILE: PicFacetWatcher/Info.plist
        CODE_SIGN_ENTITLEMENTS: PicFacetWatcher/PicFacetWatcher.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SKIP_INSTALL: YES
        # Uses the PicFacetCore embedded in the host app:
        # PicFacet.app/Contents/Library/LoginItems/PicFacetWatcher.app/Contents/MacOS → PicFacet.app/Contents/Frameworks
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../../Frameworks"
    dependencies:
      - target: PicFacetCore
        embed: false

  PicFacetFinderSync:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PicFacetFinderSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picfacet.app.FinderSync
        INFOPLIST_FILE: PicFacetFinderSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: PicFacetFinderSync/PicFacetFinderSync.entitlements
        SKIP_INSTALL: YES

  PicFacetCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PicFacetCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picfacet.core.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PicFacetCore
